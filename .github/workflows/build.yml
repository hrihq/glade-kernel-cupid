name: Build Kernel (GKI 6.6 + KSU Next)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'drivers/kernelsu/**'
      - 'drivers/Kconfig'
      - 'drivers/Makefile'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison build-essential cpio curl flex \
            g++-multilib gcc-multilib gperf git libelf-dev libssl-dev \
            libncurses-dev libncurses5 libtinfo5 lz4 lzop pahole python3 rsync unzip wget xz-utils zip zstd

      - name: Cache LLVM 18
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/clang
          key: llvm-18.1.8-x86_64-v2

      - name: Download LLVM 18
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/clang"
          curl -fL -o "$RUNNER_TEMP/clang.tar.xz" \
            https://github.com/llvm/llvm-project/releases/download/llvmorg-18.1.8/clang+llvm-18.1.8-x86_64-linux-gnu-ubuntu-18.04.tar.xz
          tar -xJf "$RUNNER_TEMP/clang.tar.xz" -C "$RUNNER_TEMP/clang" --strip-components=1

      - name: Show toolchain
        run: |
          echo "$RUNNER_TEMP/clang/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/clang/bin/clang" --version

      - name: Configure kernel
        run: |
          make O=out ARCH=arm64 LLVM=1 gki_defconfig
          ./scripts/config --file out/.config -e KSU -d KSU_DEBUG -d KSU_SUSFS
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          ./scripts/config --file out/.config -d KSU_SUSFS
          make O=out ARCH=arm64 LLVM=1 olddefconfig
          grep -E '^CONFIG_(KSU|LTO|CFI_CLANG)' out/.config || true
          if grep -q '^CONFIG_KSU_SUSFS=y' out/.config; then
            echo "SUSFS still enabled, but kernel-side susfs patches are missing"; exit 1
          fi
          grep -q '^CONFIG_KSU=y' out/.config || { echo "CONFIG_KSU not enabled"; exit 1; }

      - name: Build Image
        run: |
          make O=out ARCH=arm64 LLVM=1 -j"$(nproc)" Image
          ls -lh out/arch/arm64/boot/Image out/vmlinux

      - name: Package flashable zip (AnyKernel3)
        run: |
          SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          ZIP_NAME="Glade-Kernel-cupid-6.6-KSU-${SHORT_SHA}.zip"
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md
          cp out/arch/arm64/boot/Image ak3/Image
          sed -i 's/^kernel.string=.*/kernel.string=Glade Kernel 6.6 (GKI) + KernelSU-Next/' ak3/anykernel.sh
          sed -i 's/^do.devicecheck=1/do.devicecheck=0/' ak3/anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=boot;|' ak3/anykernel.sh
          sed -i 's|^IS_SLOT_DEVICE=.*|IS_SLOT_DEVICE=auto;|' ak3/anykernel.sh
          grep -nE '^(BLOCK|IS_SLOT_DEVICE|do\.)' ak3/anykernel.sh
          (cd ak3 && zip -r9 "$GITHUB_WORKSPACE/$ZIP_NAME" . -x '*.git*')
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          ls -lh "$ZIP_NAME"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: |
            ${{ env.ZIP_NAME }}
            out/arch/arm64/boot/Image
            out/.config
